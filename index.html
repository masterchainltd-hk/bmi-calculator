<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI 計算機 | 你的第一個微型工具</title>
    <style>
        /* 基礎設定與排版 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f3f4f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); 
            width: 100%; 
            max-width: 400px; 
        }
        h1 { text-align: center; color: #1f2937; margin-bottom: 24px; font-size: 24px;}
        
        /* 表單與按鈕設計 */
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; color: #4b5563; font-weight: 500;}
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            font-size: 16px; 
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #3b82f6; 
            color: #ffffff; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: background-color 0.2s; 
            margin-top: 8px;
        }
        button:hover { background-color: #2563eb; }
        
        /* 結果顯示區塊 */
        #result { 
            margin-top: 24px; 
            text-align: center; 
            display: none; 
            padding: 20px; 
            border-radius: 8px; 
        }
        .bmi-value { font-size: 32px; font-weight: bold; margin-bottom: 8px; }
        .bmi-status { font-size: 16px; font-weight: 500; }
        
        /* 狀態顏色 */
        .normal { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .warning { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .danger { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BMI 計算機</h1>
        
        <div class="form-group">
            <label for="height">身高 (公分)</label>
            <input type="number" id="height" placeholder="例如：170" required>
        </div>
        
        <div class="form-group">
            <label for="weight">體重 (公斤)</label>
            <input type="number" id="weight" placeholder="例如：65" required>
        </div>
        
        <button onclick="calculateBMI()">計算 BMI</button>
        
        <div id="result">
            <div class="bmi-value" id="bmi-value"></div>
            <div class="bmi-status" id="bmi-status"></div>
        </div>
    </div>

    <script>
        function calculateBMI() {
            const heightInput = document.getElementById('height').value;
            const weightInput = document.getElementById('weight').value;
            const resultDiv = document.getElementById('result');
            const valueDiv = document.getElementById('bmi-value');
            const statusDiv = document.getElementById('bmi-status');

            // 檢查輸入值是否有效
            if (!heightInput || !weightInput || heightInput <= 0 || weightInput <= 0) {
                alert('請輸入有效的身高與體重數值！');
                return;
            }

            // 計算邏輯
            const heightInMeters = heightInput / 100;
            const bmi = (weightInput / (heightInMeters * heightInMeters)).toFixed(1);
            
            valueDiv.textContent = `BMI: ${bmi}`;
            resultDiv.style.display = 'block';

            // 清除之前的狀態顏色
            resultDiv.className = '';

            // 判斷狀態（採用台灣國健署成人標準）
            if (bmi < 18.5) {
                statusDiv.textContent = '狀態：體重過輕';
                resultDiv.classList.add('warning');
            } else if (bmi >= 18.5 && bmi < 24) {
                statusDiv.textContent = '狀態：正常範圍';
                resultDiv.classList.add('normal');
            } else if (bmi >= 24 && bmi < 27) {
                statusDiv.textContent = '狀態：過重';
                resultDiv.classList.add('warning');
            } else {
                statusDiv.textContent = '狀態：輕度或以上肥胖';
                resultDiv.classList.add('danger');
            }
        }
    </script>
</body>
</html>
